name: CI

on:
  pull_request:
    branches: [main, dev/**]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: i18n catalogs
        run: npm run i18n:check
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Tests + coverage
        run: npm test -- --coverage --run
