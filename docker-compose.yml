services:
  roxom-playout-manager:
    build:
      context: .
    ports:
      - "3450:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?required}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?required}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?required}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?required}
      ADMIN_BOOTSTRAP_TOKEN: ${ADMIN_BOOTSTRAP_TOKEN:?required}
      NEXT_PUBLIC_APP_BASE_URL: ${NEXT_PUBLIC_APP_BASE_URL:?required}
      VIMEO_ACCESS_TOKEN: ${VIMEO_ACCESS_TOKEN:-}
      SUPABASE_FETCH_TIMEOUT_MS: ${SUPABASE_FETCH_TIMEOUT_MS:-2000}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch(`http://$${process.env.HOSTNAME}:3000/api/health`).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
